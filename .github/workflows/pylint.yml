name: Pylint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pylint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pylint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pylint
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint

      - name: Lint tracked Python files
        run: |
          mapfile -d '' python_files < <(git ls-files -z -- '*.py')
          if (( ${#python_files[@]} == 0 )); then
            echo "::error::No tracked Python files found."
            exit 1
          fi
          python -m pylint "${python_files[@]}"
